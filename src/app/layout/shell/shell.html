<a class="skip-link" href="#main-content">Skip to content</a>

<mat-sidenav-container class="shell">
  <mat-sidenav
    class="shell__sidenav"
    [mode]="sidenavMode()"
    [opened]="sidenavOpened()"
    (openedChange)="sidenavOpened.set($event)"
    aria-label="Main navigation"
  >
    <div class="shell__brand">
      <mat-icon aria-hidden="true">admin_panel_settings</mat-icon>
      <span>{{ appName }}</span>
    </div>

    <mat-nav-list>
      @for (item of navItems; track item.route) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
          (click)="onNavigate()"
        >
          <mat-icon matListItemIcon aria-hidden="true">{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="shell__content">
    <mat-toolbar class="shell__topbar">
      @if (isHandset()) {
        <button
          mat-icon-button
          type="button"
          aria-label="Toggle navigation"
          (click)="toggleSidenav()"
        >
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="shell__title">{{ pageTitle.text() }}</span>
      <span class="shell__spacer"></span>
      <button mat-icon-button type="button" aria-label="Account">
        <mat-icon>account_circle</mat-icon>
      </button>
    </mat-toolbar>

    <main id="main-content" class="shell__main" tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
